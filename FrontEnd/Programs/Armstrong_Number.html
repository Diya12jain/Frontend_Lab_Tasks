<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log("Armstrong numbers between 1 to 100 are : ")
        for (let i = 100; i <= 999; i++) {
            let sum = 0;
            let temp = i;
            while (temp > 0) {
                let r = temp % 10;
                sum += r * r * r;
                temp = Math.floor(temp / 10);
            }
            if (sum == i) {
                console.log(sum);
            }
        }
    </script>
</body>

</html>
