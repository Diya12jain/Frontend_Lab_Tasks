<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let arr = [10, -5, 20, 0, -8, 15, 0, -2];
        let count_zero = 0;
        let p_sum = 0, n_sum = 0;
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] > 0) {
                p_sum += arr[i];
            }
            else if (arr[i] < 0) {
                n_sum += arr[i];
            }
            else {
                count_zero++;
            }
        }
        console.log("Sum of positive numbers are : " + p_sum)
        console.log("Sum of negative numbers are : " + n_sum)
        console.log("total zeroes are : " + count_zero)
    </script>
</body>

</html>
