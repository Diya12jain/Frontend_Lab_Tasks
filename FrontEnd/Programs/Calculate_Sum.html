<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = 5837462;
        let e_s = 0, o_s = 0;
        while (num > 0) {
            let r = num % 10;
            if (r % 2 == 0) {
                e_s += r;
            }
            else {
                o_s += r;
            }
            num = Math.floor(num / 10);
        }
        console.log(e_s)
        console.log(o_s)
    </script>
</body>

</html>
