<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = 12321;
        let temp = num;
        let rev = 0;
        while (temp > 0) {
            let r = temp % 10;
            rev = rev * 10 + r;
            temp = Math.floor(temp / 10);
        }
        if (num == rev) {
            console.log("Given number is Palindrome.")
        }
        else {
            console.log("Given number is not Palindrome.")
        }
    </script>
</body>

</html>
