<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log("Prime numbers between 1 to 100 are :")
        for (let i = 2; i < 100; i++) {
            let f = true;
            for (let j = 2; j * j <= i; j++) {
                if (i % j == 0) {
                    f = false;
                    break;
                }
            }
            if (f) {
                console.log(i);
            }
        }
    </script>
</body>

</html>
